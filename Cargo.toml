[package]
name = "datumesh-formula"
version = "0.2.0"
description = "The Datumesh formula dialect: parser, resolver, type and unit checker, printer, canonical AST hash, exact decimal arithmetic and an evaluator with lineage and fuel."
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/datumesh-com/datumesh-formula"
homepage = "https://datumesh.com"
documentation = "https://docs.rs/datumesh-formula"
readme = "README.md"
keywords = ["datumesh", "formula", "decimal", "spreadsheet", "provenance"]
categories = ["parser-implementations", "mathematics"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "README.md"]

[features]
default = ["engine"]
# The engine's Runtime for `lang = "formula"`, and define and publish over a store. Without it,
# the language standalone (parser, checker, printer, decimals, evaluator over a World).
engine = ["dep:datumesh-engine", "dep:datumesh-store"]
# The store's SQLite backend (datumesh-store's `sqlite`, through datumesh-engine's), with the
# engine. Off by default: PgStore is always there.
sqlite = ["engine", "datumesh-engine/sqlite", "datumesh-store/sqlite"]

[dependencies]
# Strict JSON, JCS, SHA-256 and the string rules of SPEC 3.5 (Unicode 15.1 assigned, NFC);
# FunctionDescriptor (section 7 with spec-0.4.0's order and extent) and Fault.
datumesh-core = "0.3.6"
# NFC normalisation of computed strings (SPEC 15.7). Already a dependency of datumesh-core.
unicode-normalization = { version = "0.1.26", default-features = false }
# The Runtime and Inputs the formula evaluator plugs into.
datumesh-engine = { version = "0.4.0", optional = true }
# Callee descriptors and name bindings for define and the runtime; publishing a definition.
# Already a dependency of datumesh-engine.
datumesh-store = { version = "0.4.0", optional = true, default-features = false }

[dev-dependencies]
datumesh-core = { version = "0.3.6", features = ["sign"] }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[[example]]
name = "engine"
required-features = ["engine"]

[[example]]
name = "bench"
required-features = ["engine"]
